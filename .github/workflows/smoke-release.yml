# DeepSeek Harness (Linux) — 发布产物冒烟测试（真实 Linux runner）
#
# 用途：在原生 x64/arm64 GitHub Runner 上验证已发布资产（AppImage 直接运行、
# deb 安装后以普通用户启动），覆盖本地容器无法验证的 Electron SUID/命名空间沙箱路径。
# 触发：手动 workflow_dispatch（发布后运行，或排查用户报告时运行）。
name: Release smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要验证的 release tag（如 v0.2.2）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            appArch: x86_64
            debArch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appArch: arm64
            debArch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Install test tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfuse2t64 || sudo apt-get install -y -qq xvfb libfuse2
          which xvfb-run

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APP_ARCH: ${{ matrix.appArch }}
          DEB_ARCH: ${{ matrix.debArch }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*AppImage' --pattern '*.deb' --clobber
          ls -lh
          echo "APPIMAGE=$(ls *-$APP_ARCH.AppImage | head -n1)" >> "$GITHUB_ENV"
          echo "DEB=$(ls *-$DEB_ARCH.deb | head -n1)" >> "$GITHUB_ENV"

      - name: AppImage direct run (no extra flags)
        run: |
          set -euo pipefail
          chmod +x "assets/$APPIMAGE"
          xvfb-run -a -s "-screen 0 1280x800x24" "assets/$APPIMAGE" --smoke-test 2>&1 | tee /tmp/appimage.log | tail -20
          grep -q SMOKE_OK /tmp/appimage.log

      - name: deb install and normal-user run
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "./assets/$DEB"
          echo "--- sandbox helper ---"
          dpkg -L deepseek-harness-linux | grep chrome-sandbox | xargs -r ls -l
          echo "--- run as $(id -un) (NO --no-sandbox) ---"
          xvfb-run -a -s "-screen 0 1280x800x24" deepseek-harness --smoke-test 2>&1 | tee /tmp/deb.log | tail -20
          grep -q SMOKE_OK /tmp/deb.log

      - name: Show logs on failure
        if: failure()
        run: |
          echo '--- appimage log ---'; tail -50 /tmp/appimage.log 2>/dev/null || true
          echo '--- deb log ---'; tail -50 /tmp/deb.log 2>/dev/null || true
          echo '--- server log ---'; tail -50 "$HOME/.config/deepseek-harness/logs/server.log" 2>/dev/null || true
