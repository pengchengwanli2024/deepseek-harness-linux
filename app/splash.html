<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --line: #242936;
      --fg: #e8ecf4;
      --muted: #8b93a7;
      --accent: #4d8dff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2436 0%, var(--bg) 62%);
      color: var(--fg);
      font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    .wrap {
      width: 100%;
      height: 100%;
      padding: 34px 28px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      -webkit-app-region: drag;
    }
    h1 {
      margin: 2px 0 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.3px;
      -webkit-app-region: drag;
    }
    .sub {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.2px;
    }
    .bar {
      width: 220px;
      height: 3px;
      margin-top: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: slide 1.35s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    .version {
      margin-top: 6px;
      font-size: 11px;
      color: #5f677a;
      letter-spacing: 0.4px;
    }
    .hint {
      position: absolute;
      bottom: 18px;
      font-size: 11px;
      color: #4d5567;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/icon.png" alt="DeepSeek Harness" draggable="false" />
    <h1>DeepSeek Harness</h1>
    <p class="sub">正在启动本地服务，请稍候…</p>
    <div class="bar" aria-hidden="true"></div>
    <p class="version" id="version"></p>
    <p class="hint">DeepSeek Harness (Linux) · 桌面版</p>
  </div>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var v = params.get('version');
        if (v) document.getElementById('version').textContent = 'v' + v;
      } catch (_) { /* ignore */ }
    })();
  </script>
</body>
</html>
